<style>
/* Layout: one-column phone app; home = start/join; party = header bar + bottom tabs */
:root{
  --bg:#0E1116; --surface:#171B22; --sunk:#1F242D; --ink:#ECEEF2; --muted:#98A0AC; --line:#2A303A;
  --red:#F04A5C; --blue:#5E8FF0; --blue-soft:#18264A; --gold:#E2B54A; --even:#8A919C; --ok:#4CC47F;
  --brand:"Fredoka","Nunito",system-ui,sans-serif;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
:root[data-uc="light"]{
  --bg:#EDEFF3; --surface:#FFFFFF; --sunk:#E3E6EC; --ink:#14171C; --muted:#5D6571; --line:#D3D8E0;
  --red:#C0182A; --blue:#1C4EA6; --blue-soft:#DCE6F8; --gold:#9C6F00; --even:#78808C; --ok:#1E7A46;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .3s ease}
.splash.out{opacity:0;pointer-events:none}
.splogo{width:112px;height:112px;margin-bottom:6px}
.spname{font-family:var(--brand);font-weight:700;color:var(--ink);line-height:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.spname .the{font-size:14px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.spname>span:last-child{font-size:34px;letter-spacing:.01em}
.spname .g{position:relative;display:inline-block}
.spname .g::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:5px;background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%)}
.spslogan{font-family:var(--label);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion:no-preference){.sphand{transform-origin:50px 50px;animation:sweep 4s linear infinite}@keyframes sweep{to{transform:rotate(360deg)}}}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.mark{font-family:var(--brand);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1;display:flex;gap:5px;align-items:baseline;background:none;border:0;padding:0;color:var(--ink);white-space:nowrap}
.mark .logo{width:34px;height:34px;flex:0 0 auto;align-self:center;margin-right:4px;border-radius:7px}
.mark .the{font-size:12px;font-weight:600;letter-spacing:.1em;align-self:flex-start;padding-top:1px}
.mark .g{position:relative}
.mark .g::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:4px;background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%)}
.who{font-family:var(--label);font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.01em;margin:18px 0 10px;text-wrap:balance}
h3{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.note{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted)}
.note.err{color:var(--red)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--label);font-size:18px;letter-spacing:.04em;margin-bottom:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:11px 16px;min-height:44px;font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.playbtn{display:flex;align-items:center;gap:12px;width:max-content;margin:28px auto 0;padding:9px 20px 9px 16px;border-radius:12px;background:#000;color:#fff;text-decoration:none;box-shadow:0 0 0 1px rgba(255,255,255,.22)}
.playbtn svg{width:24px;height:24px;fill:#fff}
.playbtn span{display:flex;flex-direction:column;font-weight:700;font-size:19px;line-height:1.1}
.playbtn small{font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.playbtn+.themesw{margin-top:18px}
.themesw{display:flex;width:max-content;margin:28px auto 0;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.themesw button{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px}
.themesw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.invite{margin-top:10px}
.invite h2{margin:4px 0 12px}
.invite .iv-k{margin:14px 0 0;font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.iv-ev{display:grid;gap:4px;margin:0 0 14px;padding:12px 14px;border-left:4px solid var(--red);background:var(--surface);border-radius:0 12px 12px 0;color:var(--muted);font-size:14px}
.iv-ev b{color:var(--ink);font-size:17px}.iv-ev i{font-style:normal;font-weight:600}.iv-ev i.r{color:var(--red)}.iv-ev i.b{color:var(--blue)}
.invite .btn{width:100%}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
label.f{display:grid;gap:4px;font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=password],input[type=datetime-local],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-family:var(--body);font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink)}
.code-in{font-family:var(--mono)!important;letter-spacing:.2em!important;text-transform:uppercase!important}
.pill{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.pill.live{background:var(--red);color:#fff} .pill.soon{background:var(--blue-soft);color:var(--blue)} .pill.demo{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices .btn{width:100%}
.rejoin{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px}
.rejoin .t{font-family:var(--label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;opacity:.75}
.rejoin .n{font-family:var(--display);font-size:20px;line-height:1.1}
.rejoin .btn{background:var(--bg);color:var(--ink)}
.upc{display:grid;gap:8px}
.upc .ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-family:var(--label);font-size:14px;color:var(--muted)}
.ev-name{font-family:var(--display);font-size:20px;line-height:1.1}
.ev-main{font-weight:600}
.ev-main .r{color:var(--red)} .ev-main .b{color:var(--blue)}

/* party header */
.phead{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:4px}
.phead .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.phead .nm{font-family:var(--display);font-size:20px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.phead .meta{font-family:var(--label);font-size:14px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{font-family:var(--mono);font-weight:600;letter-spacing:.16em;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:4px}

/* bout tabs */
.bouttabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:thin}
.btab{flex:0 0 auto;display:grid;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;min-height:44px}
.btab span{font-family:var(--label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btab b{font-family:var(--label);font-size:15px;font-weight:700;white-space:nowrap}
.btab.on{background:var(--ink);border-color:var(--ink)} .btab.on span,.btab.on b{color:var(--bg)}

/* scorecard */
.fighters{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-top:10px}
.corner{min-width:0}
.corner .tag{font-family:var(--label);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.corner .nm{font-family:var(--display);font-size:24px;line-height:1.05;overflow-wrap:anywhere}
.corner.red .tag,.corner.red .nm{color:var(--red)}
.corner.blue{text-align:right} .corner.blue .tag,.corner.blue .nm{color:var(--blue)}
.tot{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;text-align:center;line-height:1;padding-bottom:2px}
.tot small{display:block;font-family:var(--label);font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-top:4px}
.sub{font-family:var(--label);color:var(--muted);font-size:14px;letter-spacing:.03em;margin-top:6px}
.belt{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.card-h{display:grid;grid-template-columns:40px 1fr 1fr;gap:10px;padding:8px 12px;font-family:var(--label);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--ink)}
.card-h span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px 10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.rd .n{font-family:var(--label);font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em}
.rd .n b{display:block;font-family:var(--mono);font-size:18px;color:var(--ink)}
.side{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;min-width:0}
.pt{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-height:40px;padding:0;font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
select.pt{width:100%;min-width:0;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;cursor:pointer;font-size:13px;padding:0;border-radius:6px}
select.pt option{color:var(--ink);background:var(--surface)}
.pt.r{color:var(--red)} .pt.b{color:var(--blue)}
.pt.r.on{background:var(--red);border-color:var(--red);color:#fff}
.pt.b.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rd-foot{grid-column:2 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:14px}
.rd-foot .crowd{display:flex;align-items:center;gap:6px;width:46%;min-width:96px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.rd-foot .crowd .bar{flex:1}
.dednote{display:flex;gap:8px;font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.dednote .r{color:var(--red)} .dednote .b{color:var(--blue)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.bar .br{background:var(--red)} .bar .bb{background:var(--blue)} .bar .be{background:var(--even)}
.card-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-top:2px solid var(--ink);flex-wrap:wrap}
.verdict{font-family:var(--label);font-weight:700;font-size:16px;letter-spacing:.04em}
.save{font-size:12px;color:var(--muted);font-family:var(--label);letter-spacing:.06em}
.dedcard{padding-bottom:12px}
.dedcard.shut{padding:0}
.dedadd{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--muted);font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:14px 12px;text-align:left}
.dedadd span{font-size:18px;color:var(--ink)}
.dedcard:not(.shut) .dedadd{padding-top:4px}
.dedx{background:none;border:0;color:var(--muted);font-size:16px;padding:6px 10px;min-width:44px;min-height:36px}
/* who you got? */
.wyg{padding:0 12px 12px}.wyg .ded-h{display:flex;justify-content:space-between;align-items:center;padding-inline:0}
.wyg .lock{font-size:11px;letter-spacing:.1em}
.wyg-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}

};
const REACTS=['🥊','🔥','😱','🤡','💤'];
const SMALL_MAX=25;
const SPORTS={boxing:['Boxing',10],mma:['MMA',3],kickboxing:['Kickboxing',3],muaythai:['Muay Thai',5],whitecollar:['White collar',3],other:['Other',3]};
const sportKey=ev=>SPORTS[ev&&ev.sport]?ev.sport:'boxing';
const sportLabel=ev=>SPORTS[sportKey(ev)][0];
const sportOptions=sel=>Object.entries(SPORTS).map(([k,[l]])=>`<option value="${k}"${k===sel?' selected':''}>${l}</option>`).join('');
function parseBouts(text,sport){const def=(SPORTS[sport]||SPORTS.boxing)[1];
  const lines=String(text||'').split('\n').map(x=>x.trim()).filter(Boolean);if(lines.length>30)return{err:'Up to 30 bouts per card'};
  const bouts=[];for(const [i,l] of lines.entries()){const parts=l.split('|').map(x=>x.trim());const m=parts[0].split(/\s+(?:vs\.?|v)\s+/i);
    if(m.length!==2||!m[0]||!m[1])return{err:'Line '+(i+1)+' needs “Name vs Name”'};
    const n=parseInt(parts[1],10);const rounds=Math.min(15,Math.max(1,Number.isFinite(n)?n:def));
    bouts.push({id:'b'+(i+1),red:m[0].slice(0,60),blue:m[1].slice(0,60),rounds,weight:(parts[2]||'').slice(0,40),title:/title|belt/i.test(parts[3]||'')})}
  return bouts.length?{bouts}:{err:'Add at least one bout'}}

/* ---------- helpers ---------- */
const bk=(e,b)=>e+'__'+b;
const lastN=n=>String(n||'').split(' ').pop();
const full=x=>Array.isArray(x)&&typeof x[0]==='number'&&typeof x[1]==='number';
const evById=id=>S.events.find(e=>e.id===id)||null;
function findBout(key){if(!key)return null;const i=key.indexOf('__');if(i<0)return null;const ev=evById(key.slice(0,i));if(!ev)return null;
  const bt=(ev.bouts||[]).find(x=>x.id===key.slice(i+2));return bt?{ev,bt,key}:null}
function status(ev){const t=Date.parse(ev.starts_at);if(!t)return'';const now=Date.now();
  if(now>=t&&now<t+6*36e5)return'live';if(now<t)return t-now<7*864e5?'soon':'upcoming';return now<t+3*864e5?'recent':'past'}   // 'recent': kept for 3 days so people can score the replay
function fmtDate(iso){const d=new Date(iso);if(isNaN(d))return'';return d.toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function totals(r,d){let a=0,b=0,n=0,pa=0,pb=0;(r||[]).forEach(x=>{if(full(x)){a+=x[0];b+=x[1];n++}});
  (Array.isArray(d)?d:[]).forEach(p=>{if(p&&p.c==='r')pa++;else if(p&&p.c==='b')pb++});return{a:a-pa,b:b-pb,n,pa,pb}}
const winner=t=>t.a>t.b?'r':t.b>t.a?'b':'e';
const HOW={ko:'KO',tko:'TKO',rtd:'RTD',dq:'DQ',sub:'Submission',other:'Stoppage'};
const HOW_LONG={ko:'KO (knockout)',tko:'TKO (referee stoppage)',rtd:'RTD (corner retirement)',dq:'DQ (disqualification)',sub:'Submission',other:'Other stoppage'};
const normEnd=e=>(e&&typeof e==='object'&&Number.isInteger(e.rd)&&e.rd>0&&['r','b','nc'].includes(e.w))?{rd:e.rd,w:e.w,how:HOW[e.how]?e.how:null}:null;
const endText=(e,bt,short)=>e.w==='nc'?`No contest · round ${e.rd}`:`${short?lastN(e.w==='r'?bt.red:bt.blue):(e.w==='r'?bt.red:bt.blue)} wins${e.how?' by '+HOW[e.how]:''} · round ${e.rd}`;
/* ---------- results, picks and votes ----------
   Stored in each person's own scores row (the `ended` json), so no new tables are needed:
   ended = {res:{w:'r'|'b'|'d'|'nc', how, rd, at}, pick:'rko'|'rdec'|'bko'|'bdec', pickAt, vote:'fair'|'rob', rd,w,how (legacy, stoppages only)} */
const STOP=['ko','tko','rtd','dq','sub','other'];           // fight ends in a round
const STOP_KO=['ko','tko','rtd','sub','other'];             // counts as "by KO / by finish" for picks (DQ doesn't)
const DEC=['ud','sd','md'], DRAWS=['dud','dsd','dmd'];
Object.assign(HOW,{ud:'UD',sd:'SD',md:'MD',dud:'Unanimous draw',dsd:'Split draw',dmd:'Majority draw'});
Object.assign(HOW_LONG,{ud:'UD (unanimous decision)',sd:'SD (split decision)',md:'MD (majority decision)',dud:'Unanimous draw',dsd:'Split draw',dmd:'Majority draw'});
const finishSport=ev=>['mma','other'].includes(sportKey(ev));
const koWord=ev=>finishSport(ev)?'finish':'KO';
function parseEnded(x){const o=x&&typeof x==='object'?x:{};let res=null;const q=o.res;
  if(q&&typeof q==='object'&&['r','b','d','nc'].includes(q.w))res={w:q.w,how:HOW[q.how]?q.how:null,rd:Number.isInteger(q.rd)&&q.rd>0?q.rd:null,at:+q.at||0};
  else{const e=normEnd(o);if(e)res={w:e.w,how:e.w==='nc'?null:(e.how||'tko'),rd:e.rd,at:0}}   // results saved by the old "Fight ended early?" panel
  return{res,pick:['rko','rdec','bko','bdec'].includes(o.pick)?o.pick:null,pickAt:+o.pickAt||0,vote:['fair','rob'].includes(o.vote)?o.vote:null,voteFor:typeof o.voteFor==='string'?o.voteFor:null}}
function rowToCard(row){return{r:row.rounds||[],d:row.deductions||[],...parseEnded(row.ended),at:Date.parse(row.updated_at)||0}}
function buildEnded(c){const o={};
  if(c.res){o.res=c.res;const s=stopOf(c.res);if(s){o.rd=s.rd;o.w=s.w;if(s.how)o.how=s.how}}   // legacy fields keep older versions of the app working
  if(c.pick){o.pick=c.pick;o.pickAt=c.pickAt||Date.now()}if(c.vote){o.vote=c.vote;if(c.voteFor)o.voteFor=c.voteFor}return Object.keys(o).length?o:null}
const stopOf=res=>res&&res.rd&&(res.w==='nc'||STOP.includes(res.how))?{rd:res.rd,w:res.w==='nc'?'nc':res.w,how:res.w==='nc'?null:res.how}:null;
// a vote counts for the kind of result it was cast on (a correction from SD to MD keeps votes; decision to stoppage resets them)
const resCat=res=>!res?null:res.w==='nc'?'nc':res.w==='d'?'draw':STOP_KO.includes(res.how)?'stop':res.how==='dq'?'dq':'dec';
const voteOf=(c,pr)=>c&&c.vote&&pr&&(!c.voteFor||c.voteFor===resCat(pr))?c.vote:null;
const rawCard=(uid,key)=>(S.cards[uid]&&S.cards[uid][key])||null;
const rawMine=key=>rawCard(S.uid,key)||{r:[],d:[]};
// The party's result: the host's entry if they made one, otherwise the first one entered. Solo: yours.
function partyResult(key){const host=S.party&&S.party.host;const ids=new Set([S.uid,...(S.party&&!S.party.solo?S.members.map(m=>m.user_id):[])]);
  let hostRes=null,first=null,firstBy=null;
  for(const uid of ids){const c=rawCard(uid,key);if(!c||!c.res)continue;if(uid===host){hostRes=c.res;continue}
    if(!first||(c.res.at||0)<(first.at||0)){first=c.res;firstBy=uid}}
  if(hostRes)return{...hostRes,by:host,byHost:true};return first?{...first,by:firstBy,byHost:false}:null}
const canSetResult=key=>{const pr=partyResult(key);return !pr||!S.party||S.party.solo||S.party.host===S.uid||pr.by===S.uid};
function resultText(res,bt,short){if(!res)return'';const nm=c=>short?lastN(c==='r'?bt.red:bt.blue):(c==='r'?bt.red:bt.blue);
  if(res.w==='nc')return 'No contest'+(res.rd?' · round '+res.rd:'');
  if(res.w==='d')return res.how?HOW[res.how]:'Draw';
  const how=res.how?(DEC.includes(res.how)?' by '+{ud:'unanimous decision',sd:'split decision',md:'majority decision'}[res.how]:' by '+HOW[res.how]):'';
  return nm(res.w)+' wins'+how+(stopOf(res)&&res.rd?' · round '+res.rd:'')}
const pickText=(p,bt,ev,short)=>p?`${short?lastN(p[0]==='r'?bt.red:bt.blue):lastN(p[0]==='r'?bt.red:bt.blue)} by ${p.slice(1)==='ko'?koWord(ev):'decision'}`:'';
function pickScore(p,res){if(!p||!res||res.w==='nc')return null;const fighter=(res.w==='r'||res.w==='b')&&p[0]===res.w;
  const cat=STOP_KO.includes(res.how)?'ko':DEC.includes(res.how)?'dec':null;return{fighter,method:fighter&&!!cat&&cat===p.slice(1)}}
function cardOf(uid,key){const c=rawCard(uid,key);const e=stopOf(partyResult(key));let r=(c&&Array.isArray(c.r))?c.r:[],d=(c&&Array.isArray(c.d))?c.d:[];
  if(e){r=r.slice(0,e.rd);d=d.filter(p=>p.rd<e.rd)}return{r,d,e,pick:c&&c.pick||null,vote:c&&c.vote||null}}
const myCard=key=>cardOf(S.uid,key);
const hasScored=key=>(rawMine(key).r||[]).some(Boolean);
const picksVisible=key=>!!rawMine(key).pick||hasScored(key)||!!partyResult(key);
function partyCards(key){const out={};const live=S.members.length?new Set(S.members.map(m=>m.user_id)):null;for(const uid of Object.keys(S.cards)){if(live&&!live.has(uid)&&uid!==S.uid)continue;const raw=rawCard(uid,key);if(raw&&((raw.r||[]).some(Boolean)||(raw.d||[]).length))out[uid]=cardOf(uid,key)}return out}
function roundStats(cards,rounds){const res=[];for(let i=0;i<rounds;i++){let r=0,b=0,e=0,sa=0,sb=0;
  for(const c of Object.values(cards)){const x=c.r[i];if(!full(x))continue;if(x[0]>x[1])r++;else if(x[1]>x[0])b++;else e++;sa+=x[0];sb+=x[1]}
  const n=r+b+e;res.push({r,b,e,n,aa:n?sa/n:0,ab:n?sb/n:0})}return res}
function barHTML(s){if(!s||!s.n)return'<div class="bar"></div>';const p=v=>(v/s.n*100).toFixed(1)+'%';
  return `<div class="bar" role="img" aria-label="${s.r} red, ${s.e} even, ${s.b} blue"><i class="br" style="width:${p(s.r)}"></i><i class="be" style="width:${p(s.e)}"></i><i class="bb" style="width:${p(s.b)}"></i></div>`}
function memberName(uid){if(uid===S.uid)return (S.nick||'You')+' (you)';const m=S.members.find(x=>x.user_id===uid);return m?m.nickname:'Fan'}
function verdictSummary(cards,rounds){let wr=0,wb=0,wd=0,sa=0,sb=0;for(const c of Object.values(cards)){const t=totals(c.r,c.d);
  if(c.e){if(c.e.w==='r')wr++;else if(c.e.w==='b')wb++;continue}  // stoppage: winner decided, no-contest not counted
  if(t.n<rounds)continue;
  const w=winner(t);if(w==='r')wr++;else if(w==='b')wb++;else wd++;sa+=t.a;sb+=t.b}const done=wr+wb+wd;return{wr,wb,wd,done,avgA:done?sa/done:0,avgB:done?sb/done:0}}
const pc=(v,n)=>n?Math.round(v/n*100)+'%':'—';
function genCode(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';const a=new Uint32Array(6);crypto.getRandomValues(a);for(let i=0;i<6;i++)c+=ch[a[i]%ch.length];return c}

/* ---------- data ---------- */
async function loadEvents(){const {data,error}=await sb.from('events').select('*').order('starts_at');
  if(!error&&data)S.events=[...data,...S.events.filter(e=>e.is_custom&&!data.some(x=>x.id===e.id))]}
async function loadInvite(code){
  const {data:p}=await sb.from('parties').select('*').eq('code',code).maybeSingle();
  if(!p||p.solo){S.invite={code,missing:true};return}
  const ev=evById(p.event_id)||await fetchCard(p.event_id);
  if(isCreator(p)){const {data:n}=await sb.rpc('uc_crowd_stats',{p_code:code,p_bout:''});S.invite={code,party:p,ev,creator:true,count:n&&n.members||0};return}
  const {data:ms}=await sb.from('party_members').select('user_id,nickname').eq('party_code',code);
  const host=(ms||[]).find(m=>m.user_id===p.host);
  S.invite={code,party:p,ev,host:host?host.nickname:'',count:(ms||[]).length}}
function vInvite(){const iv=S.invite||{};
  if(iv.missing)return `<div class="invite"><h2>That invite isn’t working</h2>
    <div class="panel"><p style="margin:0">There’s no party with the code <b class="code">${esc(iv.code||'')}</b>. Check the link or the code with whoever sent it.</p>
    <button class="btn" type="button" data-act="inviteHome">Go to the home screen</button></div></div>`;
  const ev=iv.ev,bt=ev&&(ev.bouts||[])[0];
  return `<div class="invite"><p class="iv-k">${iv.creator?'Watch-along':'You’re invited'}</p>
    <h2>${iv.creator?'You’re joining '+esc(cpName(iv.party)):iv.host?esc(iv.host)+' has invited you to a party':'You’ve been invited to a party'}</h2>
    <div class="iv-ev">${ev?`<b>${esc(ev.name)}</b>${bt?`<span><i class="r">${esc(bt.red)}</i> v <i class="b">${esc(bt.blue)}</i></span>`:''}${ev.starts_at&&!ev.is_custom?`<span>${esc(fmtDate(ev.starts_at))}</span>`:''}`:''}
      <span>${iv.count===1?'1 person':iv.count+' people'} ${iv.creator?'in the crowd':'in the party'} · code <b class="code">${esc(iv.code)}</b></span></div>
    <form class="panel" id="inviteForm" autocomplete="off"><label class="f" for="inviteNick">Your name</label>
      <input type="text" id="inviteNick" maxlength="30" autocomplete="nickname" enterkeyhint="go" placeholder="e.g. Sarah" value="${esc(S.nick)}">
      <button class="btn red" type="submit">${iv.creator?'Join the watch-along':'Join party'}</button>
      <p class="small muted" style="margin:0">${iv.creator?(S.joinKey?'You’re joining as a co-host on the panel.':'Score along and your card joins the crowd stats. If you’re watching with mates, you can add your mates party too.'):'This is how you’ll appear to everyone in the party.'}</p></form>
    <p style="text-align:center;margin-top:18px"><button class="linkbtn" type="button" data-act="inviteHome">Not now, go to the home screen</button></p></div>`}
async function fetchCard(id){const {data}=await sb.from('events').select('*').eq('id',id).maybeSingle();

async function loadMembers(){if(!S.party)return;const code=S.party.code;const {data}=await sb.from('party_members').select('user_id,nickname,joined_at').eq('party_code',code).order('joined_at');

async function loadPartyScores(){if(!S.party)return;const {data}=await sb.from('scores').select('user_id,bout_key,rounds,deductions,ended,updated_at').eq('party_code',S.party.code);

function applyRow(row){if(!row||!row.user_id||row.user_id===S.uid)return;

function subscribe(){unsubscribe();const code=S.party.code;
  const ch=sb.channel('party-'+code,{config:{presence:{key:S.uid}}});
  ch.on('postgres_changes',{event:'*',schema:'public',table:'scores',filter:'party_code=eq.'+code},p=>{if(p.new&&p.new.user_id){applyRow(p.new);render()}})
    .on('postgres_changes',{event:'*',schema:'public',table:'party_members',filter:'party_code=eq.'+code},async()=>{await loadMembers();render()})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'parties',filter:'code=eq.'+code},p=>{if(p.new&&p.new.code){const prev=S.party||{};S.party=p.new;if((prev.solo&&!p.new.solo)||(prev.chat_off&&!p.new.chat_off))loadChat().then(()=>renderChat());if(!prev.chat_off&&p.new.chat_off)S.chat.open=false;
      const ev=evById(p.new.event_id);if(ev&&ev.is_custom&&ev.owner!==S.uid)fetchCard(ev.id).then(()=>render());render()}})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'party_code=eq.'+code},p=>{if(p.new&&p.new.id)onChatMessage(p.new)})
    .on('presence',{event:'sync'},()=>{S.online=new Set(Object.keys(ch.presenceState()));render()})
    .subscribe(async st=>{if(st==='SUBSCRIBED'){try{await ch.track({nick:S.nick})}catch(e){}}});
  S.channel=ch}

  if(!evById(p.event_id))await loadEvents();

  if(!opts.keepTab)S.ptab='mates';

/* ---------- saving my card ---------- */
const pending=new Set();let saveTimer=null,saving=false;
function setSave(t){S.saveState=t;const el=$('#saveState');if(el)el.textContent=t}
function backupMine(){if(S.party)ls.set('fg_backup_'+S.party.code,S.cards[S.uid]||{})}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(flushSaves,600);setSave('Saving…')}
async function flushSaves(){clearTimeout(saveTimer);if(saving||!pending.size||!S.party)return;saving=true;
  const keys=[...pending];pending.clear();const code=S.party.code;
  const rows=keys.map(k=>{const c=rawMine(k);return{party_code:code,user_id:S.uid,bout_key:k,rounds:c.r||[],deductions:c.d||[],ended:buildEnded(c),updated_at:new Date().toISOString()}});
  const {error}=await sb.from('scores').upsert(rows,{onConflict:'party_code,user_id,bout_key'});
  if(!error&&S.cp&&S.party&&S.cp.party.event_id===S.party.event_id){const cc=S.cp.party.code;
    const {error:ce}=await sb.from('scores').upsert(rows.map(r=>({...r,party_code:cc})),{onConflict:'party_code,user_id,bout_key'});
    if(ce&&!flushSaves.warned){flushSaves.warned=true;toast('Couldn’t add your card to the watch-along: '+ce.message)}}
  saving=false;
  if(error){keys.forEach(k=>pending.add(k));setSave('Not saved yet, retrying…');setTimeout(flushSaves,4000)}
  else{setSave('Saved');if(!pending.size&&S.party&&S.party.code===code)ls.set('fg_backup_'+code,null);keys.forEach(maybePostRounds)}
  if(pending.size&&!error)flushSaves()}

async function sendChat(kind,body){body=String(body||'').trim().slice(0,280);if(!body||!S.party||S.party.solo)return false;

function maybePostRounds(key){if(!S.party||S.party.solo||S.party.chat_off)return;const f=findBout(key);if(!f)return;const {bt}=f;
  const cards=partyCards(key);const ids=Object.keys(cards);if(ids.length<2||!cards[S.uid])return;
  const rs=roundStats(cards,bt.rounds);const L=lastN(bt.red),R=lastN(bt.blue);
  for(let i=0;i<bt.rounds;i++){
    if(!full(cards[S.uid].r[i])||!ids.every(u=>full(cards[u].r[i])))continue;
    const id='sys-'+S.party.code+'-'+key+'-r'+(i+1);
    if(S.chat.posted.has(id)||S.chat.msgs.some(x=>x.id===id))continue;
    S.chat.posted.add(id);const s=rs[i];let txt;
    if(s.r===s.n)txt=`all ${s.n} gave it to ${L}`;else if(s.b===s.n)txt=`all ${s.n} gave it to ${R}`;else if(s.e===s.n)txt=`all ${s.n} scored it even`;

    const body=`Round ${i+1} · ${L} v ${R}: ${txt}`;
    addMsg({id,user_id:S.uid,kind:'system',body,created_at:new Date().toISOString()});
    sb.from('chat_messages').upsert({id,party_code:S.party.code,user_id:S.uid,kind:'system',body},{onConflict:'id',ignoreDuplicates:true}).then(()=>{},()=>{});
  }
  markSeen();renderChat()}

// Play button: only on Android browsers, never inside the installed app, and only once the listing is live
function showPlay(){

  let inApp=false;

function vScore(ev){const f=findBout(S.sel);if(!f||f.ev.id!==ev.id)return `<div class="empty" style="margin-top:14px"><strong>No bouts on this card yet</strong>Check back once the card is announced.</div>`;
  const {bt,key}=f;const {r,d,e}=myCard(key);const t=totals(r,d);const maxR=e?Math.min(e.rd,bt.rounds):bt.rounds;
  let h=`<div class="sub" style="margin-top:14px">${[bt.weight?esc(bt.weight):'',bt.title?'<span class="belt">★ Title fight</span>':'',bt.rounds+' rounds'].filter(Boolean).join(' · ')}</div>
  <div class="fighters"><div class="corner red"><div class="tag">Red corner</div><div class="nm">${esc(bt.red)}</div></div>
  <div class="tot">${t.a}–${t.b}<small>${t.n}/${maxR} RDS${t.pa||t.pb?' · PTS OFF':''}${e?' · STOPPED':''}</small></div>
  <div class="corner blue"><div class="tag">Blue corner</div><div class="nm">${esc(bt.blue)}</div></div></div>
  ${vPick(f)}
  <div class="card"><div class="card-h"><span>Rd</span><span style="color:var(--red)">${esc(lastN(bt.red))}</span><span style="color:var(--blue)">${esc(lastN(bt.blue))}</span></div>`;
  for(let i=0;i<maxR;i++){const x=Array.isArray(r[i])?r[i]:[null,null];
    const dr=d.filter(p=>p.rd===i&&p.c==='r').length,db=d.filter(p=>p.rd===i&&p.c==='b').length;
    const side=(c,val,nm)=>{const low=typeof val==='number'&&val<=7;
      return `<div class="side" role="group" aria-label="Round ${i+1}, ${esc(nm)}">${PTS.map(v=>{const on=val===v;
        return `<button type="button" class="pt ${c}${on?' on':''}" aria-pressed="${on}" data-act="score" data-i="${i}" data-c="${c}" data-v="${v}">${v}</button>`}).join('')}<select class="pt low ${c}${low?' on':''}" id="low-${c}-${i}" data-i="${i}" data-c="${c}" aria-label="Round ${i+1}, ${esc(nm)}, 7 or lower"><option value=""${low?'':' selected'}>7↓</option>${LOW.map(v=>`<option value="${v}"${val===v?' selected':''}>${v}</option>`).join('')}</select></div>`};
    h+=`<div class="rd"><div class="n">RD<b>${i+1}</b></div>${side('r',x[0],bt.red)}${side('b',x[1],bt.blue)}
      ${dr||db||(x[0]==null)!==(x[1]==null)?`<div class="rd-foot"><span class="dednote">${dr?`<span class="r">${esc(lastN(bt.red))} −${dr}</span>`:''}${db?`<span class="b">${esc(lastN(bt.blue))} −${db}</span>`:''}${(x[0]==null)!==(x[1]==null)?'<span>Half scored</span>':''}</span></div>`:''}</div>`}
  const lead=e?(e.w==='nc'?'e':e.w):winner(t);
  const vtext=e?esc(endText(e,bt))
    :(!t.n?'No rounds scored':(lead==='r'?esc(bt.red)+' ':lead==='b'?esc(bt.blue)+' ':'')+(t.n>=bt.rounds?(lead==='e'?'Draw':'wins'):(lead==='e'?'Level':'leads'))+' '+t.a+'–'+t.b);
  h+=`<div class="card-f"><span class="verdict" style="color:var(--${lead==='r'?'red':lead==='b'?'blue':'muted'})">${vtext}</span>
   <span class="row"><span class="save" id="saveState">${esc(S.saveState)}</span><button class="btn sm red" type="button" data-act="shareCard">Share card</button><button class="btn sm ghost" type="button" data-act="clear">Clear card</button></span></div></div>`;
  let lastScored=0;r.forEach((x,i)=>{if(x)lastScored=i});
  const dedOpen=S.dedOpen===key;const dedRd=Math.min(r.filter(full).length,maxR-1);   // the round being fought: the next one you haven't scored
  h+=`<div class="card dedcard ded${dedOpen||d.length?'':' shut'}">${dedOpen||d.length?'<div class="ded-h">Point deductions</div>':''}
   ${dedOpen?`<div class="dedform"><button type="button" class="btn ghost dr" data-act="deduct" data-c="r" data-rd="${dedRd}">−1 ${esc(lastN(bt.red))}</button><button type="button" class="btn ghost db" data-act="deduct" data-c="b" data-rd="${dedRd}">−1 ${esc(lastN(bt.blue))}</button>
     <p class="small muted" style="grid-column:1 / -1;margin:0">Comes off that fighter’s total.</p></div>`:''}
   ${d.length?`<ul class="dedlist">${d.map((p,j)=>`<li><strong class="${p.c==='r'?'r':'b'}">−1 ${esc(p.c==='r'?bt.red:bt.blue)}</strong><button type="button" class="dedx" data-act="undeduct" data-j="${j}" aria-label="Remove this deduction">✕</button></li>`).join('')}</ul>`:''}
   <button type="button" class="dedadd" data-act="dedToggle">${dedOpen?'<span>−</span> Done':'<span>＋</span> Add a point deduction'}</button></div>
  ${vResult(f)}
  <p class="small muted">Pick a score for each fighter. Choosing below 10 for one fills 10 for the other. Tap a score again to clear it.${S.party.solo?'':' To see how your party scored each round, open Party stats.'}</p>`;
  return h}

function vPick(f){const {bt,key,ev}=f;const mine=rawMine(key);const p=mine.pick;const pr=partyResult(key);
  const missed=!p&&(hasScored(key)||!!pr);const kw=koWord(ev);
  const btn=(c,m)=>{const id=c+m;const on=p===id;const off=(p&&!on)||missed;
    return `<button type="button" class="pk ${c}${on?' on':''}${off?' off':''}" ${p||missed?'disabled':''} data-act="wyg" data-p="${id}" aria-pressed="${on}"><b>${esc(lastN(c==='r'?bt.red:bt.blue))}</b><span>by ${m==='ko'?kw:'decision'}</span></button>`};
  return `<div class="card dedcard wyg"><div class="ded-h"><span>Who you got?</span><span class="lock">${p?'🔒 Locked in':missed?'Missed it':'One tap · no changes'}</span></div>
    <div class="wyg-g">${btn('r','ko')}${btn('b','ko')}${btn('r','dec')}${btn('b','dec')}</div>
    ${missed?'<p class="small muted" style="margin:8px 2px 0">Picks close once you score your first round.</p>':p?'':`<p class="small muted" style="margin:8px 2px 0">Make your pick before you score round 1.${kw==='KO'?' KO includes TKOs and retirements.':' A finish is any KO, TKO or submission.'}</p>`}</div>`}

function vResult(f){const {bt,key,ev}=f;const pr=partyResult(key);const ed=S.resEdit&&S.resEdit.key===key?S.resEdit:null;const solo=!S.party||S.party.solo;
  const host=S.party&&S.party.host===S.uid;
  let h=`<div class="card dedcard res"><div class="ded-h">Result</div>`;
  if(!pr||ed){const w=ed&&ed.w;
    h+=`<p class="small muted" style="margin:0 12px 8px">${pr?'Correct the result for your party.':solo?'When the fight’s over, enter the official result.':'When the fight’s over, enter the official result. Anyone in the party can, and the host can correct it.'}</p>
    <div class="seg">${[['r',lastN(bt.red)],['d','Draw'],['b',lastN(bt.blue)],['nc','NC']].map(([k,l])=>`<button type="button" class="${w===k?'on '+k:''}" data-act="resW" data-w="${k}" aria-pressed="${w===k}">${esc(l)}</button>`).join('')}</div>`;
    if(w){const opts=w==='d'?DRAWS:w==='nc'?[]:(finishSport(ev)?['tko','sub','dq','other']:['ko','tko','rtd','dq']).concat(DEC);
      const how=ed.how&&(opts.includes(ed.how))?ed.how:opts[0];const lbl=k=>finishSport(ev)&&k==='tko'?'KO / TKO':HOW_LONG[k];
      if(opts.length)h+=`<select id="resHow" aria-label="How">${opts.map(k=>`<option value="${k}"${k===how?' selected':''}>${esc(lbl(k))}</option>`).join('')}</select>`;
      if(w==='nc'||STOP.includes(how))h+=`<select id="resRd" aria-label="Round">${Array.from({length:bt.rounds},(_,i)=>`<option value="${i+1}"${i+1===(ed.rd||1)?' selected':''}>Round ${i+1}</option>`).join('')}</select>`;
      h+=`<div class="dedform"><button type="button" class="btn red" data-act="resSave" style="grid-column:1 / -1">Save result</button>${pr?'<button type="button" class="btn ghost" data-act="resCancel" style="grid-column:1 / -1">Cancel</button>':''}</div>`}
    return h+`</div>`}
  const col=pr.w==='r'?'var(--red)':pr.w==='b'?'var(--blue)':'var(--ink)';
  const who=solo?'':pr.by===S.uid?(pr.byHost?'Entered by you (host)':'Entered by you'):(pr.byHost?'Entered by the host':'Entered by '+esc(memberName(pr.by)));
  h+=`<p class="resline" style="color:${col}">${esc(resultText(pr,bt))}</p>
    <p class="small muted" style="margin:0 12px 10px">${who}${!solo&&!canSetResult(key)?' · only the host can change it':''}${stopOf(pr)?(who?' · rounds after that are hidden':'Rounds after that are hidden'):''}</p>`;
  if(canSetResult(key))h+=`<div class="dedform" style="margin-top:-4px"><button type="button" class="btn ghost" data-act="resEdit" style="grid-column:1 / -1">${!solo&&host&&pr.by!==S.uid?'Correct the result':'Change the result'}</button></div>`;
  if(pr.w!=='nc'){const st=STOP_KO.includes(pr.how);const mine=voteOf(rawMine(key),pr);
    h+=`<div class="ded-h" style="padding-top:4px">${st?'Fair stoppage?':'Fair or robbery?'}</div>
    <div class="vote"><button type="button" class="${mine==='fair'?'on fair':''}" data-act="vote" data-v="fair" aria-pressed="${mine==='fair'}">${st?'Fair stoppage':'Fair'}</button><button type="button" class="${mine==='rob'?'on rob':''}" data-act="vote" data-v="rob" aria-pressed="${mine==='rob'}">${st?'Too early':'Robbery!'}</button></div>`}
  const p=rawMine(key).pick;const ps=pickScore(p,pr);const c=myCard(key);const t=totals(c.r,c.d);const lines=[];
  if(p)lines.push(`<div><b>Your pick:</b> ${esc(pickText(p,bt,ev))} ${pr.w==='nc'?'<span class="muted">· void</span>':ps.method?'🎯':ps.fighter?'✓ <span class="muted">right fighter</span>':'✗'}</div>`);
  if(!stopOf(pr)&&pr.w!=='nc'&&t.n>=bt.rounds){const mw=winner(t);const ok=mw===(pr.w==='d'?'e':pr.w);
    lines.push(`<div><b>Your card:</b> ${mw==='e'?'Draw':esc(lastN(mw==='r'?bt.red:bt.blue))} ${Math.max(t.a,t.b)}–${Math.min(t.a,t.b)} ${ok?'✓':'✗'}</div>`)}
  if(lines.length)h+=`<div class="sum">${lines.join('')}</div>`;
  return h+`</div>`}

function cellClass(x){return x[0]>x[1]?'cr':x[1]>x[0]?'cb':'ce'}
// 3-letter code for a fighter (last name), e.g. FUR / JOS
function fCode(n){return lastN(n).replace(/[^A-Za-zÀ-ž]/g,'').slice(0,3).toUpperCase()||'?'}
// One person's card as a horizontal strip: rounds across, red and blue rows, running total on the right.
// o = {name, badge, me, card:{r,d,e}, pick (html), vote (text)}
function stripHTML(o,bt,rounds){const c=o.card||{r:[],d:[],e:null};const t=totals(c.r,c.d);const N=Math.max(rounds,1);
  const cols=`30px repeat(${N},minmax(0,1fr)) 38px`;const cl=x=>full(x)?(x[0]>x[1]?'r':x[1]>x[0]?'b':'e'):'';
  let g=`<span class="h" style="text-align:left">RD</span>`;for(let i=0;i<N;i++)g+=`<span class="h">${i+1}</span>`;g+=`<span class="h" style="text-align:right">TOT</span>`;
  const w=t.n?winner(t):'';
  for(const side of [0,1]){g+=`<span class="f" style="color:var(--${side?'blue':'red'})">${esc(fCode(side?bt.blue:bt.red))}</span>`;
    for(let i=0;i<N;i++){const x=c.r[i];const k=cl(x);const won=full(x)&&(side?x[1]>x[0]:x[0]>x[1]);
      g+=full(x)?`<span class="c ${k}${won?' w':''}">${x[side]}</span>`:`<span class="c x"></span>`}
    g+=`<span class="tot ${t.n&&w===(side?'b':'r')?w:(t.n&&w==='e'?'e':'')}">${t.n?(side?t.b:t.a):'·'}</span>`}
  const dd=Array.from({length:N},(_,i)=>{const r=c.d.filter(p=>p&&p.rd===i&&p.c==='r').length,b=c.d.filter(p=>p&&p.rd===i&&p.c==='b').length;
    return (r?`<span style="color:var(--red)">−${r}</span>`:'')+(b?`<span style="color:var(--blue)">−${b}</span>`:'')});
  if(dd.some(Boolean))g+=`<span></span>${dd.map(x=>`<span class="dd">${x}</span>`).join('')}<span></span>`;
  let v='';
  if(c.e){v=c.e.w==='nc'?`<span class="e">No contest · Rd ${c.e.rd}</span>`:`<span class="${c.e.w}">${esc(lastN(c.e.w==='r'?bt.red:bt.blue))} by ${c.e.how?HOW[c.e.how]:'stoppage'} · Rd ${c.e.rd}</span>`}

function statBlock(cards,bt){const n=Object.keys(cards).length;let v=verdictSummary(cards,bt.rounds);const rs=roundStats(cards,bt.rounds);
  const live=!v.done;if(live)v=verdictSummary(cards,1);/* no finished cards yet: show who's ahead so far */
  let hot=-1,best=-1;rs.forEach((s,i)=>{if(s.n<2)return;const split=1-Math.abs(s.r-s.b)/s.n;if(split>best){best=split;hot=i}});
  let h=`<div class="statgrid"><div class="stat r"><div class="k">${esc(lastN(bt.red))}</div><div class="v">${pc(v.wr,v.done)}</div></div>
    <div class="stat"><div class="k">Draw</div><div class="v">${pc(v.wd,v.done)}</div></div><div class="stat b"><div class="k">${esc(lastN(bt.blue))}</div><div class="v">${pc(v.wb,v.done)}</div></div></div>
    <p class="small muted">${live?`Who's ahead so far on ${v.done} card${v.done===1?'':'s'}. The verdict switches to full cards once the fight is scored.`:`${v.done} full card${v.done===1?'':'s'} out of ${n} scoring. Average card ${v.avgA.toFixed(1)}–${v.avgB.toFixed(1)}.`}</p>`;
  if(hot>=0&&best>=0.5)h+=`<div class="callout"><span class="k">Most disputed round</span><span class="v">Round ${hot+1}: ${rs[hot].r} had it ${esc(lastN(bt.red))}, ${rs[hot].b} had it ${esc(lastN(bt.blue))}${rs[hot].e?`, ${rs[hot].e} even`:''}</span></div>`;
  h+=`<h3>Round by round</h3><div class="card" style="margin-top:0">${rs.map((s,i)=>`<div class="rstat${i===hot&&best>=0.5?' hot':''}"><span class="n">RD ${i+1}</span>${barHTML(s)}<span class="avg">${s.n?s.aa.toFixed(1)+' – '+s.ab.toFixed(1):'no cards'}</span></div>`).join('')}</div>
    <p class="small muted">Bars show the share of cards giving each round to red, even or blue. Numbers are the average round score.</p>`;
  return {h,rs,v,n}}

function vResultStats(key,bt,ev){const pr=partyResult(key);const ids=[S.uid,...S.members.map(m=>m.user_id).filter(u=>u!==S.uid)];

      return `<div><span>${esc(memberName(x.id))}</span><em class="${s?(s.fighter?'ok':'no'):''}" style="${!s&&show?`color:${x.p[0]==='r'?'var(--red)':'var(--blue)'}`:''}">${show?esc(pickText(x.p,bt,ev))+(s?(s.method?' 🎯':s.fighter?' ✓':' ✗'):''):x.p?'🔒 Picked':'<span class="muted">No pick</span>'}</em></div>`}).join('')}</div>`;

function vPartyStats(ev){const f=findBout(S.sel);if(!f)return'';const {bt,key}=f;const cards=partyCards(key);const n=Object.keys(cards).length;

  if(!ids.length)h+=`<div class="empty"><strong>No panel cards yet</strong>The panel’s cards appear here once they start scoring.</div>`;
  else{const name=uid=>uid===S.uid?'You':esc((c.panel.find(m=>m.user_id===uid)||{}).nickname||'Panel');
    const anyPick=ids.some(id=>{const x=cardFor(id);return x&&x.pick});
    h+=`<div class="strips">${ids.map(id=>{const x=cardFor(id);const raw=id===S.uid?rawMine(key):(S.cp.cards[id]&&S.cp.cards[id][key]);
      return stripHTML({name:id===S.uid?(onPanel?(S.nick||'You')+' (you)':'You'):((c.panel.find(m=>m.user_id===id)||{}).nickname||'Panel'),me:id===S.uid,
        badge:id===c.party.host?'★ HOST':onPanel||id!==S.uid?'PANEL':'',card:x||{r:[],d:[],e:null},pick:pickLabel(x&&x.pick,id===S.uid,vis,bt,ev)},bt,rounds)}).join('')}</div>`;
    if(anyPick&&!vis)h+='<p class="small muted">🔒 Make your pick or score round 1 to see the panel’s picks.</p>'}
  if(watching.length)h+=`<p class="small muted">Watching the crowd: ${watching.map(m=>esc(m.nickname)).join(', ')}</p>`;
  // the crowd
  const cr=c.crowd&&c.crowd.key===key?c.crowd:null;
  h+=`<h3>The crowd</h3>`;
  if(!cr)return h+`<p class="muted">Loading the crowd…</p>`;
  if(cr.err||!cr.data)return h+`<div class="note err">Couldn’t load the crowd stats${cr.err?': '+esc(cr.err):''}</div>`;
  const d=cr.data;const n=d.n||0;
  if(!n)h+=`<div class="empty"><strong>No crowd cards yet</strong>${(d.members||0).toLocaleString()} in the watch-along. Stats fill in as people score.</div>`;
  else{const rs=Array.from({length:rounds},(_,i)=>{const x=(d.rounds||[]).find(q=>q.i===i)||{r:0,b:0,e:0,sa:0,sb:0};const m=x.r+x.b+x.e;return{r:x.r,b:x.b,e:x.e,n:m,aa:m?x.sa/m:0,ab:m?x.sb/m:0}});
    const A=d.ahead||{r:0,b:0,e:0};const an=A.r+A.b+A.e;
    h+=`<div class="statgrid"><div class="stat r"><div class="k">${esc(lastN(bt.red))}</div><div class="v">${pc(A.r,an)}</div></div><div class="stat"><div class="k">Level</div><div class="v">${pc(A.e,an)}</div></div><div class="stat b"><div class="k">${esc(lastN(bt.blue))}</div><div class="v">${pc(A.b,an)}</div></div></div>
      <p class="small muted">Who’s ahead on ${n.toLocaleString()} crowd card${n===1?'':'s'}, out of ${(d.members||0).toLocaleString()} in the watch-along.</p>`;
    let hot=-1,best=-1;rs.forEach((s,i)=>{if(s.n<2)return;const split=1-Math.abs(s.r-s.b)/s.n;if(split>best){best=split;hot=i}});
    // panel v crowd
    const notes=[];for(const m of panel){const x=cardFor(m.user_id);if(!x)continue;let agree=0,cnt=0,alone=[];
      rs.forEach((s,i)=>{const v=x.r[i];if(!full(v)||s.n<2)return;const maj=s.r>s.b&&s.r>s.e?'r':s.b>s.r&&s.b>s.e?'b':null;if(!maj)return;cnt++;const mine=v[0]>v[1]?'r':v[1]>v[0]?'b':'e';if(mine===maj)agree++;else if(mine!=='e'&&Math.max(s.r,s.b)/s.n>=0.7)alone.push(i+1)});
      if(cnt)notes.push(`<div><span>${esc(m.user_id===S.uid?'You':m.nickname)}</span><em>${agree} of ${cnt} rounds with the crowd${alone.length?` · out on their own in rd ${alone.join(', ')}`:''}</em></div>`)}
    if(!onPanel){const x=myCard(key);let agree=0,cnt=0;rs.forEach((s,i)=>{const v=x.r[i];if(!full(v)||s.n<2)return;const maj=s.r>s.b&&s.r>s.e?'r':s.b>s.r&&s.b>s.e?'b':null;if(!maj)return;cnt++;if((v[0]>v[1]?'r':v[1]>v[0]?'b':'e')===maj)agree++});
      if(cnt)notes.push(`<div><span>You</span><em>${agree} of ${cnt} rounds with the crowd</em></div>`)}
    if(notes.length)h+=`<h3>Panel v crowd</h3><div class="card rescard"><div class="wl">${notes.join('')}</div></div>`;
    if(hot>=0&&best>=0.5)h+=`<div class="callout"><span class="k">Most disputed round</span><span class="v">Round ${hot+1}: ${pc(rs[hot].r,rs[hot].n)} had it ${esc(lastN(bt.red))}, ${pc(rs[hot].b,rs[hot].n)} had it ${esc(lastN(bt.blue))}</span></div>`;
    h+=`<h3>Round by round</h3><div class="card" style="margin-top:0">${rs.map((s,i)=>`<div class="rstat${i===hot&&best>=0.5?' hot':''}"><span class="n">RD ${i+1}</span>${barHTML(s)}<span class="avg">${s.n?pc(s.r,s.n)+' · '+pc(s.b,s.n):'no cards'}</span></div>`).join('')}</div>
      <p class="small muted">Share of the crowd giving each round to ${esc(lastN(bt.red))} (red), even (grey) or ${esc(lastN(bt.blue))} (blue).</p>`}
  const P=d.picks||{},V=d.votes||{};const np=(P.rko||0)+(P.rdec||0)+(P.bko||0)+(P.bdec||0),nv=(V.fair||0)+(V.rob||0);
  if(np){h+=`<h3>Who the crowd got</h3>`;
    h+=vis?`<div class="card" style="margin-top:0">${[['rko','r'],['rdec','r'],['bko','b'],['bdec','b']].map(([k,cc])=>`<div class="rstat pk3"><span class="n" style="color:var(--${cc==='r'?'red':'blue'})">${esc(pickText(k,bt,ev))}</span><div class="bar"><i class="${cc==='r'?'br':'bb'}" style="width:${(P[k]||0)/np*100}%"></i></div><span class="avg">${pc(P[k]||0,np)}</span></div>`).join('')}</div><p class="small muted">${np.toLocaleString()} pick${np===1?'':'s'} in the crowd.</p>`
      :`<p class="small muted">🔒 Make your pick or score round 1 to see who the crowd got.</p>`}
  if(nv&&pr&&pr.w!=='nc')h+=`<h3>Fair or robbery?</h3><div class="rb">${V.fair?`<span class="f" style="flex:${V.fair}">Fair ${pc(V.fair,nv)}</span>`:''}${V.rob?`<span class="rob" style="flex:${V.rob}">Robbery ${pc(V.rob,nv)}</span>`:''}</div><p class="small muted">${nv.toLocaleString()} vote${nv===1?'':'s'} in the crowd.</p>`;
  h+=`<p class="small muted">Updated ${new Date(cr.at).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'})}. Refreshes every 15 seconds. <button type="button" class="linkbtn" data-act="cpRefresh">Refresh now</button></p>
    <div class="note" style="text-align:center">No chat in watch-alongs.${S.party&&!S.party.solo?' Chat with your mates in the Mates tab.':''}</div>`;
  return h}

function vParty(){const ev=evById(S.party.event_id);if(!ev)return `<div class="note">This fight night is no longer on the schedule.</div><p><button class="btn ghost" type="button" data-act="leaveNow">Back to start</button></p>`;

function vSetup(){return `<h2>Almost there</h2><div class="note">Paste your Supabase project URL and public key into the CONFIG section near the bottom of this file, then reload. The setup guide shows where to find them.</div>`}

/* ---------- render ---------- */
let deferRender=false;
function setTheme(t){S.theme=t==='light'?'light':'dark';ls.set('uc_theme',S.theme==='light'?'light':null);
  const r=document.documentElement;if(S.theme==="light")r.dataset.uc="light";else delete r.dataset.uc;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.theme==='light'?'#EDEFF3':'#0E1116';render()}
function hideSplash(){const sp=$('#splash');if(!sp||sp.classList.contains('out'))return;sp.classList.add('out');setTimeout(()=>sp.remove(),400)}
function render(){
  // Don't redraw underneath a scoring drop-down someone has open (live updates arrive constantly)
  const ae=document.activeElement;
  if(S.view==='party'&&ae&&ae.tagName==='SELECT'&&(ae.classList.contains('pt')||ae.id==='dedRd')&&ae.isConnected){deferRender=true;return}
  deferRender=false;
  $('#who').innerHTML=S.nick?('<span class="sa">Scoring as </span>'+esc(S.nick)):'';
  const v=$('#view');const y=window.scrollY;
  let html;
  if(!configured)html=vSetup();
  else if(S.err)html=`<div class="note err" style="margin-top:12px">${esc(S.err)}</div>`;
  else if(!S.ready)html='';
  else if(S.view==='admin')html=vAdmin();
  else if(S.view==='invite'&&S.invite)html=vInvite();
  else if(S.view==='party'&&S.party)html=vParty();
  else html=vHome();
  v.innerHTML=html;window.scrollTo(0,y);
  if(S.ready||S.err||!configured)hideSplash();
  // tabs
  const tabs=$('#tabs');
  if(S.view==='party'&&S.party&&evById(S.party.event_id)){
    const cust=evById(S.party.event_id).is_custom;
    let list=S.ptab==='creator'&&S.cp?[...(cpOnPanel()?[['host','Host']]:[]),['score','Scorecard'],['crowd','Party stats'],['global','Global stats']]:S.party.solo?[['score','Scorecard'],['global','Global stats']]:[['score','Scorecard'],['pscores','Party scores'],['pstats','Party stats'],['global','Global stats']];
    if(cust)list=list.filter(x=>x[0]!=='global');
    if(S.party.big)list=list.filter(x=>x[0]!=='pscores');
    if(!list.some(t=>t[0]===S.tab))S.tab='score';
    $('#tabsIn').style.gridTemplateColumns=`repeat(${list.length},1fr)`;
    $('#tabsIn').innerHTML=list.map(([id,l])=>`<button type="button" data-tab="${id}" aria-current="${S.tab===id?'page':'false'}">${l}</button>`).join('');
    tabs.hidden=list.length<2||!!S.editCard}else tabs.hidden=true;
  renderChat();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(deferRender)render()},0));

/* ---------- events ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.expand=null;render();window.scrollTo(0,0);if(S.tab==='global')loadGlobal(S.sel);if(S.tab==='crowd'||S.tab==='host')refreshCp();return}
  const a=t.dataset.act;
  if(a!=='leave'&&a!=='cpLeave')S.confirmLeave=false;
  switch(a){
    case 'home': if(S.party){S.view='party'}else{S.view='home';await loadEvents()}render();break;
    case 'start': case 'solo': {const p=$('#evPick');if(!p)return;t.disabled=true;
      if(a==='start'&&S.homeCreator&&creatorOn())await createCreator(p.value);else await createParty(p.value,a==='solo',{});t.disabled=false;break}
    case 'switchNo': {const was=S.switchAsk;S.switchAsk=null;if(S.party)S.view='party';render();break}
    case 'switchYes': {const a=S.switchAsk;if(!a)break;S.switchAsk=null;t.disabled=true;
      if(a.from){unsubscribe();await flushSaves();await sb.from('party_members').delete().eq('party_code',a.from).eq('user_id',S.uid)}
      if(a.start)await createParty(a.start.eventId,false,{...a.start.opts,force:true});else await enterParty(a.code,false,null,{force:true});
      if(S.cp)S.ptab='mates';break}
    case 'ptab': S.ptab=t.dataset.v==='creator'&&S.cp?'creator':'mates';S.addSheet=null;S.confirmLeave=false;
      if(S.ptab==='creator'){if(S.tab==='pscores'||S.tab==='pstats')S.tab='crowd';refreshCp()}else if(S.tab==='crowd'||S.tab==='host')S.tab='score';render();window.scrollTo(0,0);break;
    case 'addSheet': S.addSheet=S.addSheet===t.dataset.v?null:t.dataset.v;render();{const i=$(S.addSheet==='watch'?'#cpCode':'#mjCode');if(i)i.focus()}break;
    case 'addClose': S.addSheet=null;render();break;
    case 'cpCopy': await cpCopy(t.dataset.v);break;
    case 'cpHost': S.cpHost=!S.cpHost;S.cpRename=false;S.confirmKick=null;S.confirmReset=false;render();break;
    case 'cpRename': S.cpRename=true;render();{const i=$('#cpNewName');if(i){i.focus();i.select()}}break;
    case 'cpRemove': {const id=t.dataset.id;if(S.confirmKick!==id){S.confirmKick=id;render();break}S.confirmKick=null;
      const {error}=await sb.rpc('uc_panel_remove',{p_code:S.cp.party.code,p_user:id});toast(error?'Couldn’t move them: '+error.message:'Moved to the crowd');await refreshCp();break}
    case 'cpReset': {if(!S.confirmReset){S.confirmReset=true;render();break}S.confirmReset=false;
      const {error}=await sb.rpc('uc_panel_key',{p_code:S.cp.party.code,p_reset:true});toast(error?'Couldn’t reset it: '+error.message:'Panel link reset. Copy the new one for your co-hosts.');render();break}
    case 'cpRefresh': await refreshCp();break;
    case 'cpLeave': if(!S.confirmLeave){S.confirmLeave=true;render()}else{S.confirmLeave=false;const nm=cpName(S.cp&&S.cp.party);await leaveCreator(true);
      // only following the watch-along (no mates party)? Go back to the home screen. Otherwise stay with your mates.
      if(S.party&&S.party.solo)await leaveParty();else render();toast('You’ve left '+nm);window.scrollTo(0,0)}break;
    case 'inviteHome': S.view='home';S.invite=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}render();window.scrollTo(0,0);break;
    case 'rejoin': {const c=ls.get('fg_party',null),rc=ls.get('fg_cparty',null);if(c&&await enterParty(c)){if(rc){await attachCreator(rc);if(S.cp){S.ptab='creator';render()}}}break}
    case 'pick': S.sel=t.dataset.key;ls.set('fg_sel',S.sel);S.expand=null;render();if(S.tab==='global')loadGlobal(S.sel);if(S.ptab==='creator'&&S.cp)loadCrowd(S.sel).then(render);break;
    case 'score': setScore(+t.dataset.i,t.dataset.c,+t.dataset.v,true);break;
    case 'deduct': {const cur=rawMine(S.sel);const rd=+(t.dataset.rd||0);saveBout(S.sel,[...(cur.r||[])],[...(cur.d||[]),{c:t.dataset.c,rd}]);toast('Point deducted');break}
    case 'undeduct': {const cur=rawMine(S.sel);const vis=myCard(S.sel).d[+t.dataset.j];const d=[...(cur.d||[])];const j=d.indexOf(vis);if(j>=0)d.splice(j,1);saveBout(S.sel,[...(cur.r||[])],d);break}
    case 'clear': if(t.dataset.sure){saveBout(S.sel,[],[])}else{t.dataset.sure='1';t.textContent='Tap to confirm'}break;
    case 'wyg': {const key=S.sel;const cur=rawMine(key);if(cur.pick||hasScored(key)||partyResult(key))break;
      const f=findBout(key);saveBout(key,[...(cur.r||[])],[...(cur.d||[])],{pick:t.dataset.p,pickAt:Date.now()});if(f)toast('Locked in: '+pickText(t.dataset.p,f.bt,f.ev));break}
    case 'resW': {const pr=partyResult(S.sel);const ed=S.resEdit&&S.resEdit.key===S.sel?S.resEdit:{key:S.sel,rd:null,how:null};const f=findBout(S.sel);const w=t.dataset.w;
      const sameSide=ed.w&&((ed.w==='d')===(w==='d'))&&ed.w!=='nc'&&w!=='nc';
      S.resEdit={...ed,w,how:sameSide?ed.how:(w==='d'?'dsd':w==='nc'?null:'ud'),rd:ed.rd||(pr&&pr.rd)||Math.max(1,Math.min(rawMine(S.sel).r.length||1,f?f.bt.rounds:1))};render();break}
    case 'resEdit': {const pr=partyResult(S.sel);S.resEdit={key:S.sel,w:pr?pr.w:null,how:pr?pr.how:null,rd:pr?pr.rd:null};render();break}
    case 'resCancel': S.resEdit=null;render();break;
    case 'dedToggle': S.dedOpen=S.dedOpen===S.sel?null:S.sel;render();break;
    case 'resSave': {const ed=S.resEdit;const f=findBout(S.sel);if(!ed||!ed.w||!f||!canSetResult(S.sel))break;
      const how=ed.w==='nc'?null:(($('#resHow')||{}).value||ed.how);const needRd=ed.w==='nc'||STOP.includes(how);
      const rd=needRd?Math.max(1,Math.min(+(($('#resRd')||{}).value||ed.rd||1),f.bt.rounds)):null;
      const res={w:ed.w,how,rd,at:Date.now()};const cur=rawMine(S.sel);S.resEdit=null;
      saveBout(S.sel,[...(cur.r||[])],[...(cur.d||[])],{res});toast(resultText(res,f.bt));break}
    case 'vote': {const cur=rawMine(S.sel);const pr=partyResult(S.sel);if(!pr)break;const v=voteOf(cur,pr)===t.dataset.v?null:t.dataset.v;saveBout(S.sel,[...(cur.r||[])],[...(cur.d||[])],{vote:v,voteFor:resCat(pr)});break}
    case 'invite': await inviteFriends();if(S.addSheet==='mates'&&S.party&&!S.party.solo){S.addSheet=null;S.ptab='mates';render()}break;
    case 'editCard': S.editCard=!S.editCard;render();window.scrollTo(0,0);break;
    case 'hostPanel': S.hostPanel=!S.hostPanel;S.confirmKick=null;S.confirmBig=false;render();break;
    case 'makeSmall': await updateParty({big:false},'Back to a small party');break;
    case 'kick': {const id=t.dataset.id;if(S.confirmKick!==id){S.confirmKick=id;render();break}S.confirmKick=null;await removeMember(id);break}
    case 'shareCard': await shareCard();break;
    case 'shareClose': {const o=$('#shareOv');if(o){if(o.dataset.url)URL.revokeObjectURL(o.dataset.url);o.remove()}break}
    case 'shareNative': await shareNative();break;
    case 'shareSave': await shareSave();break;
    case 'leave': if(!S.confirmLeave){S.confirmLeave=true;render()}else await leaveParty();break;
    case 'leaveNow': await leaveParty();break;
    case 'expand': S.expand=S.expand===t.dataset.id?null:t.dataset.id;render();break;
    case 'psView': ls.set('uc_psview',t.dataset.v==='totals'?'totals':'rounds');S.expand=null;render();break;
    case 'refreshGlobal': loadGlobal(S.sel);break;
    case 'chatOpen': openChat();break;
    case 'chatClose': closeChat();break;
    case 'react': sendChat('react',t.dataset.r);break;
    case 'msgMenu': S.chat.menu=S.chat.menu===t.dataset.id?null:t.dataset.id;renderChat();break;
    case 'mute': {const id=t.dataset.id;if(!isMuted(id))S.chat.muted.push(id);ls.set('fg_muted',S.chat.muted);S.chat.menu=null;toast('Muted '+memberName(id)+'. Their messages are hidden on your phone.');renderChat();break}
    case 'unmute': S.chat.muted=[];ls.set('fg_muted',[]);renderChat();break;
    case 'report': {const mid=t.dataset.id;S.chat.reported.add(mid);S.chat.menu=null;renderChat();
      const {error}=await sb.from('chat_reports').insert({id:'rep-'+newId(),message_id:mid,party_code:S.party?S.party.code:'',reporter:S.uid});
      toast(error?'Couldn’t send the report: '+error.message:'Reported and hidden. Thanks for flagging it.');break}
    case 'theme': setTheme(t.dataset.v);break;
    case 'admin': S.view='admin';if(CONFIG.mode==='claude'&&!S.admin.ok)await checkAdmin('owner',true);else if(S.admin.secret&&!S.admin.ok)await checkAdmin(S.admin.secret,true);render();window.scrollTo(0,0);break;
    case 'lockAdmin': S.admin={secret:null,ok:false,edit:null,confirmDel:null};ss.set('fg_admin',null);render();break;
    case 'editEv': S.admin.edit=t.dataset.id;render();window.scrollTo(0,0);break;
    case 'cancelEdit': S.admin.edit=null;render();break;
    case 'delEv': {const id=t.dataset.id;if(S.admin.confirmDel!==id){S.admin.confirmDel=id;render();return}S.admin.confirmDel=null;
      const {error}=await sb.rpc('admin_delete_event',{p_secret:S.admin.secret,p_id:id});if(error)toast('Could not delete: '+error.message);else{toast('Deleted');await loadEvents()}render();break}
  }
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='hpChat'){updateParty({chat_off:t.checked},t.checked?'Chat switched off':'Chat switched on');return}
  if(t.name==='ptype'){S.homeCreator=t.value==='creator';const w=$('#cpNameWrap');if(w)w.hidden=!S.homeCreator;const b=$('#startBtn');if(b)b.textContent=S.homeCreator?'Start the watch-along':'Start a party';if(S.homeCreator){const n=$('#cpName');if(n)n.focus()}return}
  if(t.id==='cpWatch'&&S.cp){const watching=!t.checked;sb.from('party_members').update({watching}).eq('party_code',S.cp.party.code).eq('user_id',S.uid).then(({error})=>{if(error)toast('Couldn’t change that: '+error.message);else{toast(watching?'Just watching the crowd':'Your card is on show');refreshCp()}});return}
  if((t.id==='resHow'||t.id==='resRd')&&S.resEdit){S.resEdit[t.id==='resHow'?'how':'rd']=t.id==='resRd'?+t.value:t.value;if(t.id==='resHow')render();return}
  if(t.id==='evPick'){S.homeCustom=t.value==='__custom';const cf=$('#customForm');if(cf)cf.hidden=!S.homeCustom;if(S.homeCustom){const n=$('#cName');if(n)n.focus()}}
  else if(t.id==='cSport'){const h=$('#cHint');const sp=SPORTS[t.value]||SPORTS.boxing;if(h)h.textContent=h.textContent.replace(/Leave the rounds out and .*? rounds are used for [^.]+\./,`Leave the rounds out and ${sp[1]} rounds are used for ${sp[0]}.`)}
  else if(t.id==='nick'){S.nick=t.value.trim().slice(0,30);ls.set('fg_nick',S.nick);$('#who').innerHTML=S.nick?('<span class="sa">Scoring as </span>'+esc(S.nick)):''}
  else if(t.classList&&t.classList.contains('low')){setScore(+t.dataset.i,t.dataset.c,t.value===''?null:+t.value,false);t.blur()}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
  if(f.id==='chatForm'){const i=$('#chatIn');const v=i.value;if(!v.trim())return;i.value='';if(!(await sendChat('text',v)))i.value=v;return}
  if(f.id==='inviteForm'){const i=$('#inviteNick');const n=(i.value||'').trim().slice(0,30);if(!n){toast('Add your name first');i.focus();return}
    S.nick=n;ls.set('fg_nick',n);const b=f.querySelector('button[type=submit]');if(b){b.disabled=true;b.textContent='Joining…'}
    if(await enterParty(S.invite.code,false,S.joinKey)){S.invite=null;S.joinKey=null;return}
    if(b){b.disabled=false;b.textContent='Join party'}S.view='invite';render();return}
  if(f.id==='joinForm'){const c=($('#joinCode').value||'').toUpperCase().replace(/[^A-Z]/g,'');await enterParty(c)}
  else if(f.id==='cpJoinForm'){const v=($('#cpCode').value||'').trim();const m=/#join-([A-Za-z]{6})(?:~([a-f0-9]{24}))?/.exec(v);const code=(m?m[1]:v).toUpperCase().replace(/[^A-Z]/g,'');const key=m&&m[2]||null;
    if(code.length!==6){toast('Codes are 6 letters');return}
    const {data:p}=await sb.from('parties').select('*').eq('code',code).maybeSingle();
    if(!p){toast('No watch-along found with code '+code);return}
    if(!isCreator(p)){toast('That’s a mates party code. Use “Join” on the home screen, or ask for the watch-along code.');return}
    if(S.party&&p.event_id!==S.party.event_id){toast('That watch-along is for a different fight night');return}
    await joinCreator(p,key,false)}
  else if(f.id==='mjForm'){const c=($('#mjCode').value||'').toUpperCase().replace(/[^A-Z]/g,'');if(c.length!==6){toast('Party codes are 6 letters');return}
    const {data:p}=await sb.from('parties').select('*').eq('code',c).maybeSingle();if(p&&isCreator(p)){toast('That’s a watch-along code, not a mates party');return}
    if(p&&S.party&&p.event_id!==S.party.event_id){toast('That party is for a different fight night');return}
    if(await enterParty(c,false,null,{keepTab:true})){S.ptab='mates';render()}}
  else if(f.id==='cpRenameForm'){const n=($('#cpNewName').value||'').trim().slice(0,40);if(!n){toast('Give it a name');return}
    const {error}=await sb.from('parties').update({name:n}).eq('code',S.cp.party.code);if(error){toast('Couldn’t rename it: '+error.message);return}
    S.cp.party={...S.cp.party,name:n};S.cpRename=false;toast('Renamed to '+n);render()}
  else if(f.id==='adminLogin'){await checkAdmin($('#adminPw').value,false);render()}
  else if(f.id==='evForm')await saveEvent();
  else if(f.id==='cardEditForm'){const ev=evById(S.party&&S.party.event_id);if(!ev)return;const saved=await saveCustomCard(ev.id);if(!saved)return;
    S.editCard=false;if(!findBout(S.sel)&&saved.bouts.length){S.sel=bk(saved.id,saved.bouts[0].id);ls.set('fg_sel',S.sel)}
    if(S.party.host===S.uid)sb.from('parties').update({solo:S.party.solo}).eq('code',S.party.code).then(()=>{},()=>{});  // nudges friends to reload the card
    toast('Card saved');render()}});

async function checkAdmin(pw,quiet){if(!pw)return;const {data,error}=await sb.rpc('admin_check',{p_secret:pw});
  if(!error&&data===true){S.admin.secret=pw;S.admin.ok=true;ss.set('fg_admin',pw);await loadEvents()}
  else{S.admin.secret=null;ss.set('fg_admin',null);if(!quiet)toast('That password didn’t work')}}
async function saveEvent(){const name=$('#aName').value.trim(),dt=$('#aDate').value,venue=$('#aVenue').value.trim(),practice=$('#aPractice').checked,sport=$('#aSport').value;
  const pb=parseBouts($('#aBouts').value,sport);if(pb.err){toast(pb.err);return}const bouts=pb.bouts;
  const d=new Date(dt);if(!name||isNaN(d)||!bouts.length){toast('Add a name, start time and at least one bout');return}
  const id=S.admin.edit||(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)+'-'+d.toISOString().slice(0,10));
  const {error}=await sb.rpc('admin_save_event',{p_secret:S.admin.secret,p_id:id,p_name:name,p_starts_at:d.toISOString(),p_venue:venue,p_bouts:bouts,p_practice:practice,p_sport:sport});
  if(error){toast('Could not save: '+error.message);return}
  S.admin.edit=null;await loadEvents();toast('Saved');render()}

/* ---------- start ---------- */
setInterval(()=>{if(S.view==='party'&&S.tab==='global'&&!document.hidden)loadGlobal(S.sel,true)},30000);
setInterval(()=>{if(S.view==='party'&&S.cp&&S.ptab==='creator'&&!document.hidden){const ae=document.activeElement;if(ae&&['INPUT','SELECT','TEXTAREA'].includes(ae.tagName))return;refreshCp()}},15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSaves();else if(S.party){loadPartyScores().then(render);loadMembers();loadChat().then(()=>renderChat());if(S.cp)refreshCp()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.chat.open)closeChat()});
window.addEventListener('pagehide',()=>{flushSaves()});

async function init(){render();if(!configured)return;
  /* service worker: switched on with the Google Play release */
  if(!window.supabase||!window.supabase.createClient){S.err='Could not load the app’s database library. Check your internet connection and reload.';render();return}
  sb=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true}});
  try{let {data:{session}}=await sb.auth.getSession();
    if(!session){const {data,error}=await sb.auth.signInAnonymously();
      if(error){S.err=CONFIG.mode==='claude'?error.message:'Couldn’t sign in: '+error.message+'. In Supabase, check that anonymous sign-ins are switched on.';render();return}
      session=data.session}
    S.uid=session.user.id}
  catch(err){S.err='Couldn’t reach the database. Check the URL and key in CONFIG.';render();return}
  await loadEvents();S.ready=true;
  const m=/^#join-([A-Za-z]{6})(?:~([a-f0-9]{24}))?$/.exec(location.hash);
  const rj=ls.get('fg_party',null),rc=ls.get('fg_cparty',null);
  if(m){S.joinPrefill=m[1].toUpperCase();S.joinKey=m[2]||null;
    if(S.nick){if(rj){await enterParty(rj,true);if(rc&&S.party)await attachCreator(rc)}if(await enterParty(S.joinPrefill,false,S.joinKey)){S.joinKey=null;return}}
    else{await loadInvite(S.joinPrefill);S.view='invite'}}
  else if(rj&&S.nick){if(await enterParty(rj,true)){if(rc)await attachCreator(rc);if(S.cp)S.ptab='creator';render();return}}
  render()}
init();
})();
</script>
